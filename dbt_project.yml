# L2/D1-D7 / decisions 0004-0011: indicator meanings live in one seed.
name: fhir_indicator_line
version: 1.0.0
config-version: 2
profile: fhir_indicator_line
model-paths:
- models
seed-paths:
- seeds
test-paths:
- dbt_tests
clean-targets:
- .local/FHIR-LINE-02/dbt-target
models:
  fhir_indicator_line:
    +materialized: view
seeds:
  fhir_indicator_line:
    as_of_labels:
      +column_types:
        as_of_label: varchar
        month: integer
        day: integer
    concept:
      +column_types:
        concept_id: integer
        concept_name: varchar
        domain_id: varchar
        vocabulary_id: varchar
        concept_class_id: varchar
        standard_concept: varchar
        concept_code: varchar
        valid_start_date: date
        valid_end_date: date
        invalid_reason: varchar
    source_to_concept_map:
      +column_types:
        source_code: varchar
        source_concept_id: integer
        source_vocabulary_id: varchar
        source_code_description: varchar
        target_concept_id: integer
        target_vocabulary_id: varchar
        valid_start_date: date
        valid_end_date: date
        invalid_reason: varchar
    indicator_concepts:
      +column_types:
        concept_set: varchar
        concept_id: integer
