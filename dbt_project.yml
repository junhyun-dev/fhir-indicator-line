# L2/D1-D7: Codex implements the models; paired Claude owns expected/ and checks.
name: fhir_indicator_line
version: '1.0.0'
config-version: 2
profile: fhir_indicator_line
model-paths: [models]
seed-paths: [seeds]
test-paths: [dbt_tests]
clean-targets: [.local/FHIR-LINE-02/dbt-target]
models:
  fhir_indicator_line:
    +materialized: view
seeds:
  fhir_indicator_line:
    as_of_labels:
      +column_types:
        as_of_label: varchar
        month: integer
        day: integer
    code_map:
      # D3/M2B: only B's declared missing-unit mappings become empty strings.
      +post-hook:
        - "update {{ this }} set source_unit = '' where hospital = 'B' and source_unit is null"
      +column_types:
        hospital: varchar
        source_system: varchar
        source_code: varchar
        source_unit: varchar
        concept: varchar
        std_unit: varchar
