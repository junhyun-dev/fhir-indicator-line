  columns:
  - name: person_id
    data_tests:
    - unique:
        name: t_0005_D2_person_ext_unique
    - not_null:
        name: t_0005_D2_person_ext_not_null
    - relationships:
        name: t_0005_D2_person_ext_relationship
        arguments:
          to: ref('person')
          field: person_id
  - name: hospital
    data_tests:
    - not_null:
        name: t_0005_D2_person_ext_hospital_not_null
  - name: measurement_year
    data_tests:
    - not_null:
        name: t_0005_D2_person_ext_year_not_null
- name: omop_source_link
  description: 'D1-D3; decision 0011: source event lineage.'
  data_tests:
  - unique:
      name: t_0011_D1_source_link_event_unique
      arguments:
        column_name: omop_table || ':' || cast(omop_id as varchar)
  - unique:
      name: t_0011_D1_source_link_original_unique
      arguments:
        column_name: hospital || ':' || omop_table || ':' || source_row_key
  columns:
  - name: omop_table
    data_tests:
    - not_null:
        name: t_0011_D1_source_link_omop_table_not_null
  - name: omop_id
