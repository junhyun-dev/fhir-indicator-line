# D1,D2 / decisions 0006,0009,0011: new raw diagnosis contract.
version: 2
models:
- name: stg_b_diagnosis
  description: 'D1,D2; decisions 0006,0009,0011: every original per-admission diagnosis.'
  data_tests:
